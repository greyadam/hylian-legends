name: Replace three Discord buttons with supplied HTML
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-discord-buttons.yml']
permissions:
  contents: write
concurrency:
  group: replace-discord-buttons
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Replace only the three specified anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          home = Path('index.html')
          source = home.read_bytes()
          assert blob(source) == 'ef066746309e7b1f646ba385dc558e5626e16684', 'Homepage changed; review before applying'
          template = base64.b64decode('')
          records = json.loads('[{"location": "Header navigation", "label": "Join Discord", "old": "<a class=\\"button discord\\" href=\\"https://discord.com/invite/avApuUXfN9\\" referrerpolicy=\\"no-referrer\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\">\\u2667 Join Discord</a>"}, {"location": "Hero action", "label": "Enter the Discord", "old": "<a class=\\"button discord\\" href=\\"https://discord.com/invite/avApuUXfN9\\" referrerpolicy=\\"no-referrer\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\">\\u2667 Enter the Discord</a>"}, {"location": "Guild Hall Relay invitation", "label": "Join the Discord server", "old": "<a class=\\"button relay-join\\" href=\\"https://discord.com/invite/avApuUXfN9\\" referrerpolicy=\\"no-referrer\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\">Join the Discord server <span aria-hidden=\\"true\\">\\u2197</span></a>"}]')
          result = source
          for record in records:
              old = record['old'].encode()
              new = template.replace(b'<span>Enter the Discord</span>', ('<span>' + record['label'] + '</span>').encode())
              assert result.count(old) == 1, 'Expected exactly one ' + record['location']
              assert b'target=' not in new
              assert b'href="https://discord.gg/B7ax89XtBp"' in new
              result = result.replace(old, new, 1)
          restored = result
          for record in records:
              old = record['old'].encode()
              new = template.replace(b'<span>Enter the Discord</span>', ('<span>' + record['label'] + '</span>').encode())
              assert restored.count(new) == 1
              restored = restored.replace(new, old, 1)
          assert restored == source, 'Unexpected change outside the three buttons'
          assert result.count(b'https://discord.gg/B7ax89XtBp') == 3
          assert blob(result) == 'a9db457b190ab6523f8b37061c927e5efa80b983', 'Unexpected output'
          home.write_bytes(result)
          Path('.github/workflows/replace-discord-buttons.yml').unlink()
          PY
      - name: Commit the replacements and remove temporary workflow
        run: |
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/replace-discord-buttons.yml
          git commit -m 'Replace three homepage Discord buttons with supplied same-tab invite links'
          git push origin HEAD:main
