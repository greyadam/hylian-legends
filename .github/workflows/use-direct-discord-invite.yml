name: Use direct Discord invite URL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/use-direct-discord-invite.yml']
permissions:
  contents: write
concurrency:
  group: use-direct-discord-invite
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Replace only the five exact homepage invite URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          home = Path('index.html')
          source = home.read_bytes()
          assert blob(source) == '711b6d38e50033740934246f2137421d8b880125', 'Homepage changed; refusing to overwrite it'
          old = b'https://discord.gg/FUDj7Sj'
          new = b'https://discord.com/invite/avApuUXfN9'
          assert source.count(old) == 5, 'Expected five exact old invite URLs'
          result = source.replace(old, new)
          assert old not in result
          assert result.count(new) == 5
          assert result.count(b'href="https://discord.com/invite/avApuUXfN9"') == 4
          assert b"const DISCORD_URL='https://discord.com/invite/avApuUXfN9';" in result
          assert result.replace(new, old) == source, 'Unexpected changes outside invite URLs'
          assert blob(result) == 'be04e8d5e866259dd96c42963bb2fd5cb2d84a73', 'Unexpected homepage output'
          home.write_bytes(result)
          Path('.github/workflows/use-direct-discord-invite.yml').unlink()
          PY
      - name: Commit homepage and remove temporary installer
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/use-direct-discord-invite.yml
          git commit -m 'Use direct case-sensitive Discord invite URL throughout homepage'
          git push origin HEAD:main
