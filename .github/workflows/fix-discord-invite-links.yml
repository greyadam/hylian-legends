name: Fix Discord invite links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-discord-invite-links.yml']
permissions:
  contents: write
concurrency:
  group: fix-discord-invite-links
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update exact invite and replace JavaScript join buttons with links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          home = Path('index.html')
          source = home.read_bytes()
          assert blob(source) == '5afd549dbc98ed1457cea079a99ad8b54a256c89', 'Homepage changed; refusing to overwrite it'
          text = source.decode('utf-8')
          old = 'https://discord.gg/avApuUXfN9'
          new = 'https://discord.gg/FUDj7Sj'
          assert text.count(old) == 3, 'Unexpected number of old invite URLs'
          text = text.replace(old, new)
          for label in ['♧ Join Discord', '♧ Enter the Discord']:
              before = '<button class="button discord">' + label + '</button>'
              after = '<a class="button discord" href="' + new + '" target="_blank" rel="noopener noreferrer">' + label + '</a>'
              assert text.count(before) == 1, 'Expected one original Discord button: ' + label
              text = text.replace(before, after, 1)
          handler = "document.querySelectorAll('.discord').forEach(b=>b.onclick=()=>DISCORD_URL?window.open(DISCORD_URL,'_blank','noopener,noreferrer'):message('The hearth awaits','Add your Discord invite to DISCORD_URL in index.html to activate this button.'));"
          assert text.count(handler) == 1, 'Expected one redundant Discord onclick handler'
          text = text.replace(handler, '', 1)
          assert "const DISCORD_URL='https://discord.gg/FUDj7Sj';" in text
          assert text.count('href="https://discord.gg/FUDj7Sj"') == 4
          assert '<button class="button discord">' not in text
          assert "document.querySelectorAll('.discord')" not in text
          assert 'window.open(' not in text
          result = text.encode('utf-8')
          assert blob(result) == '711b6d38e50033740934246f2137421d8b880125', 'Unexpected output; no homepage changes applied'
          home.write_bytes(result)
          Path('.github/workflows/fix-discord-invite-links.yml').unlink()
          PY
      - name: Commit homepage and remove temporary installer
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/fix-discord-invite-links.yml
          git commit -m 'Fix Discord invite URL and use native join links'
          git push origin HEAD:main
