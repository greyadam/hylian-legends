name: Deploy standalone site to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rashid.html'
      - 'anniversary.html'
      - 'guildhall.html'
      - 'riddle-section.html'
      - 'scripts/update_sages.py'
      - 'assets/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check official Sage roster
        run: |
          python3 -m pip install beautifulsoup4
          python3 scripts/update_sages.py
      - name: Persist Sage roster loader and Guildhall link in source homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text()
          tag = '<script src="assets/sage-roster.js" defer></script>'
          if 'assets/sage-roster.js' not in html:
              if html.count('</head>') != 1:
                  raise SystemExit('Expected one document head')
              html = html.replace('</head>', tag + '</head>', 1)
          start = '<nav aria-label="Main navigation">'
          if html.count(start) != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          if 'id="guildhall-link"' not in html:
              html = html.replace(start, start + '<a id="guildhall-link" href="guildhall.html">Guildhall</a>', 1)
          page.write_text(html)
          PY
      - name: Save roster cache and source navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sage-roster.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Sage roster and persist source navigation'
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          test -f index.html
          test -f rashid.html
          test -f anniversary.html
          test -f guildhall.html
          mkdir -p _site
          cp index.html rashid.html anniversary.html guildhall.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - name: Add Guildhall navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          if html.count('<nav aria-label="Main navigation">') != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          if 'href="guildhall.html"' not in html:
              html = html.replace('</nav>', '<a id="guildhall-link" href="guildhall.html">Guildhall</a></nav>', 1)
          page.write_text(html)
          PY
      - name: Embed Rashid widget in published homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          embed = '''<section id="rashid-tracker" aria-label="Rashid location finder" style="padding:32px 0 0"><div class="wrap"><iframe id="rashid-frame" src="rashid.html" title="Rashid location finder and server-save countdown" height="440" style="display:block;width:100%;border:0;background:#0b1110"></iframe><p style="font-size:11px;text-align:right"><a href="rashid.html" target="_blank" rel="noopener noreferrer">Open Rashid tracker in a new tab ↗</a></p></div></section><script>window.addEventListener('message',function(event){const frame=document.getElementById('rashid-frame');if(!frame||event.origin!==location.origin||event.source!==frame.contentWindow||!event.data||event.data.type!=='hylian-rashid-height')return;const height=Number(event.data.height);if(Number.isFinite(height))frame.style.height=Math.min(1600,Math.max(300,height))+'px';});</script>'''
          if 'id="rashid-tracker"' not in html:
              anchor = '<section id="codex">'
              if html.count(anchor) != 1:
                  raise SystemExit('Expected exactly one Codex section; no homepage changes applied.')
              html = html.replace(anchor, embed + '\n' + anchor, 1)
          page.write_text(html)
          PY
      - name: Insert guild riddle below anniversary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          anchor = '<section id="rashid-tracker"'
          anniversary = '<section id="anniversary"'
          if html.count(anchor) != 1 or html.count(anniversary) != 1:
              raise SystemExit('Expected one anniversary and one Rashid section.')
          if html.index(anniversary) >= html.index(anchor):
              raise SystemExit('Anniversary must precede Rashid tracker.')
          if 'id="great-hylian-legend"' not in html:
              fragment = Path('riddle-section.html').read_text()
              html = html.replace(anchor, fragment + '\n' + anchor, 1)
          page.write_text(html)
          PY
      - name: Add official guild application navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          page = Path('_site/index.html')
          html = page.read_text()
          start = '<nav aria-label="Main navigation">'
          if html.count(start) != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          url = 'https://www.tibia.com/community/?subtopic=guilds&page=view&GuildName=Hylian+Legends&character=Linkmupi&action=characters'
          link = '<a id="apply-to-guild" href="' + escape(url, quote=True) + '">Apply to guild</a>'
          if 'id="apply-to-guild"' not in html:
              html = html.replace('</nav>', link + '</nav>', 1)
          page.write_text(html)
          PY
      - name: Load Sage roster in Ranks section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          tag = '<script src="assets/sage-roster.js" defer></script>'
          if 'assets/sage-roster.js' not in html:
              if html.count('</head>') != 1:
                  raise SystemExit('Expected one document head')
              html = html.replace('</head>', tag + '</head>', 1)
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
