name: Deploy standalone site to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'quests.json'
      - 'admin/**'
      - '.nojekyll'
      - 'scripts/update_sages.py'
      - 'assets/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace inline honor section and persist Royal Chamber gateway
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          home = Path('index.html')
          html = home.read_text()
          artwork = 'assets/images/At-Your-Service,-To-always-Protect-You,-My-Princess.jpg'
          assert Path(artwork).is_file(), 'Tribute artwork is missing'
          gateway = '''<section id="royal-chamber-gateway" aria-labelledby="royal-gateway-title"><div class="wrap"><article class="royal-gateway-card"><img class="royal-gateway-preview" src="assets/images/At-Your-Service,-To-always-Protect-You,-My-Princess.jpg" alt="Link and Princess Zelda" loading="lazy" decoding="async"><div><div class="micro">A sanctuary of honor</div><h2 id="royal-gateway-title">The Royal <em>Chamber</em></h2><p>Step beyond the guild hall into a tribute to loyalty, courage, and timeless devotion.</p><a class="royal-gateway-enter" href="royal-chamber.html">Enter the Royal Chamber <span aria-hidden="true">&#8594;</span></a></div></article></div></section>'''
          css = '''<style id="royal-gateway-styles">
          #royal-chamber-gateway{--gateway-gold:#d4af37;padding:48px 0;background:#0b1110}
          #royal-chamber-gateway .royal-gateway-card{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:32px;max-width:900px;margin:auto;padding:28px;border:1px solid #d4af3780;border-radius:14px;background:#131b17;box-shadow:0 10px 32px #0005,0 0 20px #d4af371a;transition:box-shadow .3s ease,border-color .3s ease}
          #royal-chamber-gateway .royal-gateway-card:hover,#royal-chamber-gateway .royal-gateway-card:focus-within{border-color:var(--gateway-gold);box-shadow:0 12px 36px #0007,0 0 28px #d4af3733}
          #royal-chamber-gateway .royal-gateway-preview{display:block;width:180px;height:150px;max-width:100%;object-fit:contain;background:#0b1110;border:1px solid #d4af3733;border-radius:8px}
          #royal-chamber-gateway .micro{color:var(--gateway-gold);letter-spacing:3px}
          #royal-chamber-gateway h2{margin:10px 0 12px;color:#f1e5c5;font:clamp(28px,4vw,38px)/1.2 Georgia,serif}
          #royal-chamber-gateway h2 em{color:var(--gateway-gold)}
          #royal-chamber-gateway p{margin:0 0 20px;color:#aca995;font:14px/1.8 Arial,sans-serif}
          #royal-chamber-gateway .royal-gateway-enter{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:12px 22px;border:1px solid var(--gateway-gold);border-radius:30px;background:var(--gateway-gold);color:#0b1110;font:700 13px/1.5 Arial,sans-serif;text-decoration:none}
          #royal-chamber-gateway .royal-gateway-enter:focus-visible{outline:3px solid #f1e5c5;outline-offset:5px}
          @media(max-width:640px){#royal-chamber-gateway .royal-gateway-card{grid-template-columns:minmax(0,1fr);gap:20px;padding:24px}#royal-chamber-gateway .royal-gateway-preview{width:100%;height:140px}#royal-chamber-gateway .royal-gateway-enter{width:100%}}
          @media(prefers-reduced-motion:reduce){#royal-chamber-gateway .royal-gateway-card{transition:none}}
          </style>'''
          pattern = r'<section\b[^>]*\bid="hylian-honor"[^>]*>.*?</section>'
          matches = re.findall(pattern, html, re.S)
          if matches:
              assert len(matches) == 1 and 'id="royal-chamber-gateway"' not in html, 'Ambiguous tribute layout'
              html = re.sub(pattern, lambda _: gateway, html, count=1, flags=re.S)
          else:
              assert html.count('id="royal-chamber-gateway"') == 1, 'Neither expected tribute nor gateway found'
              html = html.replace('>Enter Royal Chamber ', '>Enter the Royal Chamber ')
          html = re.sub(r'<script\b[^>]*\bsrc="assets/hylian-honor\.js[^\"]*"[^>]*>\s*</script>', '', html)
          if 'id="royal-gateway-styles"' not in html:
              assert html.count('</head>') == 1
              html = html.replace('</head>', css + '</head>', 1)
          assert 'id="hylian-honor"' not in html and 'honor-particles' not in html
          assert html.count('id="royal-chamber-gateway"') == 1
          assert 'Enter the Royal Chamber' in html and 'href="royal-chamber.html"' in html
          assert html.index('id="codex"') < html.index('id="royal-chamber-gateway"') < html.index('id="ranks"')
          destination = Path('royal-chamber.html')
          if not destination.exists():
              source = Path('Royal Chamber Page.html')
              assert source.is_file(), 'Existing Royal Chamber source is missing'
              chamber = source.read_text()
              assert chamber.count('src="assets/images/hylian-honor.jpg"') == 1
              chamber = chamber.replace('src="assets/images/hylian-honor.jpg"', 'src="' + artwork + '"', 1)
              chamber, count = re.subn(r'\s+onerror="[^\"]*"', '', chamber)
              assert count == 1
              assert chamber.count('</footer>') == 1
              chamber = chamber.replace('</footer>', '<p class="mt-4"><a class="hylian-btn inline-block px-5 py-2 rounded-full" href="index.html#royal-chamber-gateway">Return to Guild HQ</a></p></footer>', 1)
              destination.write_text(chamber)
          assert destination.stat().st_size > 0
          home.write_text(html)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html royal-chamber.html
          if ! git diff --cached --quiet; then
            git commit -m 'Replace homepage honor section with direct Royal Chamber gateway'
            git push origin HEAD:main
          fi
      - name: Check official Sage roster
        run: |
          python3 -m pip install beautifulsoup4
          python3 scripts/update_sages.py
      - name: Persist Sage roster loader and navigation in source homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text()
          tag = '<script src="assets/sage-roster.js" defer></script>'
          if 'assets/sage-roster.js' not in html:
              if html.count('</head>') != 1:
                  raise SystemExit('Expected one document head')
              html = html.replace('</head>', tag + '</head>', 1)
          start = '<nav aria-label="Main navigation">'
          if html.count(start) != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          if 'id="guildhall-link"' not in html:
              html = html.replace(start, start + '<a id="guildhall-link" href="guildhall.html">Guildhall</a>', 1)
          if 'id="about-link"' not in html:
              html = html.replace(start, start + '<a id="about-link" href="about.html">About</a>', 1)
          page.write_text(html)
          PY
      - name: Add guildhall details to source page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('guildhall.html')
          html = page.read_text()
          details = '''<!-- guildhall-details:start --><style>#guildhall-details{margin-top:28px}#guildhall-details .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:0 0 28px}#guildhall-details .facts div{border-bottom:1px solid var(--line);padding-bottom:12px}#guildhall-details dt{font-size:12px;color:var(--muted)}#guildhall-details dd{margin:4px 0 0;color:var(--cream)}#guildhall-details h3{color:var(--gold);font:22px Georgia,serif;margin:24px 0 12px}#guildhall-details li{margin:8px 0}</style><section id="guildhall-details" class="panel" aria-labelledby="guildhall-details-title"><h2 id="guildhall-details-title">Guildhall details</h2><dl class="facts"><div><dt>Name</dt><dd>Carlin Clanhall</dd></div><div><dt>City</dt><dd>Carlin</dd></div><div><dt>Size</dt><dd>211 sqm</dd></div><div><dt>Rent</dt><dd>250,000 gp</dd></div><div><dt>Beds</dt><dd>10</dd></div><div><dt>Levels</dt><dd>1 + underground</dd></div><div><dt>Rooms</dt><dd>15</dd></div><div><dt>Independent rooms</dt><dd>8</dd></div></dl><h3>What you can find inside</h3><ul><li>Reward Shrine</li><li>Beds for offline training</li><li>Gilded Imbuing Shrine</li><li>Ferumbras Exercise Dummy</li><li>A hireling with the Trader skill</li></ul><p>You can train your skills by using training weapons with our expert exercise dummy.</p><h3>Hireling Trader</h3><p>Our Hireling Trader buys and sells common magic supplies, such as runes and potions, at the same prices as the NPCs. The trader also sells postal items, including <a href="https://tibia.fandom.com/wiki/Parcel" target="_blank" rel="noopener noreferrer">Parcels</a> and <a href="https://tibia.fandom.com/wiki/Letter" target="_blank" rel="noopener noreferrer">Letters</a>.</p></section><!-- guildhall-details:end -->'''
          start = '<!-- guildhall-details:start -->'
          end = '<!-- guildhall-details:end -->'
          if start in html or end in html:
              if html.count(start) != 1 or html.count(end) != 1:
                  raise SystemExit('Expected one guildhall details block')
              html = re.sub(re.escape(start) + r'.*?' + re.escape(end), lambda match: details, html, flags=re.S)
          else:
              anchor = '<a class="back" href="index.html">'
              if html.count(anchor) != 1:
                  raise SystemExit('Expected one guildhall back link')
              html = html.replace(anchor, details + anchor, 1)
          page.write_text(html)
          PY
      - name: Save roster cache and source pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sage-roster.json index.html guildhall.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Sage roster and persist source page updates'
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          for file in index.html trials.html about.html rashid.html anniversary.html guildhall.html lore.html royal-chamber.html quests.html admin.html style.css quests-board.js quests-admin.js quests.json .nojekyll; do
            test -f "$file"
            cp "$file" _site/
          done
          test -f admin/index.html
          cp -R assets admin _site/
          test -f _site/admin.html
          test -f _site/admin/index.html
          test -f _site/quests.html
          test -f _site/.nojekyll
          test -s _site/royal-chamber.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text()
          assert 'id="hylian-honor"' not in html, 'Old honor section must not be published'
          assert html.count('id="royal-chamber-gateway"') == 1
          assert 'Enter the Royal Chamber' in html
          assert 'href="royal-chamber.html"' in html
          PY
      - name: Add Guildhall navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          if html.count('<nav aria-label="Main navigation">') != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          if 'href="guildhall.html"' not in html:
              html = html.replace('</nav>', '<a id="guildhall-link" href="guildhall.html">Guildhall</a></nav>', 1)
          page.write_text(html)
          PY
      - name: Embed Rashid widget in published homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          embed = '''<section id="rashid-tracker" aria-label="Rashid location finder" style="padding:32px 0 0"><div class="wrap"><iframe id="rashid-frame" src="rashid.html" title="Rashid location finder and server-save countdown" height="440" style="display:block;width:100%;border:0;background:#0b1110"></iframe><p style="font-size:11px;text-align:right"><a href="rashid.html" target="_blank" rel="noopener noreferrer">Open Rashid tracker in a new tab ↗</a></p></div></section><script>window.addEventListener('message',function(event){const frame=document.getElementById('rashid-frame');if(!frame||event.origin!==location.origin||event.source!==frame.contentWindow||!event.data||event.data.type!=='hylian-rashid-height')return;const height=Number(event.data.height);if(Number.isFinite(height))frame.style.height=Math.min(1600,Math.max(300,height))+'px';});</script>'''
          if 'id="rashid-tracker"' not in html:
              anchor = '<section id="codex">'
              if html.count(anchor) != 1:
                  raise SystemExit('Expected exactly one Codex section; no homepage changes applied.')
              html = html.replace(anchor, embed + '\n' + anchor, 1)
          page.write_text(html)
          PY
      - name: Insert guild riddle below anniversary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          anchor = '<section id="rashid-tracker"'
          anniversary = '<section id="anniversary"'
          if html.count(anchor) != 1 or html.count(anniversary) != 1:
              raise SystemExit('Expected one anniversary and one Rashid section.')
          if html.index(anniversary) >= html.index(anchor):
              raise SystemExit('Anniversary must precede Rashid tracker.')
          if 'id="great-hylian-legend"' not in html:
              fragment = Path('riddle-section.html').read_text()
              html = html.replace(anchor, fragment + '\n' + anchor, 1)
          page.write_text(html)
          PY
      - name: Add official guild application navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          page = Path('_site/index.html')
          html = page.read_text()
          start = '<nav aria-label="Main navigation">'
          if html.count(start) != 1 or html.count('</nav>') != 1:
              raise SystemExit('Expected exactly one main navigation.')
          url = 'https://www.tibia.com/community/?subtopic=guilds&page=view&GuildName=Hylian+Legends&character=Linkmupi&action=characters'
          link = '<a id="apply-to-guild" href="' + escape(url, quote=True) + '">Apply to guild</a>'
          if 'id="apply-to-guild"' not in html:
              html = html.replace('</nav>', link + '</nav>', 1)
          page.write_text(html)
          PY
      - name: Load Sage roster in Ranks section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          tag = '<script src="assets/sage-roster.js" defer></script>'
          if 'assets/sage-roster.js' not in html:
              if html.count('</head>') != 1:
                  raise SystemExit('Expected one document head')
              html = html.replace('</head>', tag + '</head>', 1)
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
