name: Audit Discord links and set explicit no-referrer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-discord-link-referrers.yml']
permissions:
  contents: write
concurrency:
  group: audit-discord-link-referrers
  cancel-in-progress: false
jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Inventory repository scripts, record static candidates, and update invite attributes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import base64, hashlib, json, re, subprocess, zlib

          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          home = Path('index.html')
          source = home.read_bytes()
          assert blob(source) == 'be04e8d5e866259dd96c42963bb2fd5cb2d84a73', 'Homepage changed; refusing to overwrite it'
          units = []
          external_scripts = []

          class Scripts(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=False)
                  self.path = path
                  self.active = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  line = self.getpos()[0]
                  for name, value in attrs:
                      if name.startswith('on') and value:
                          units.append({'path': self.path, 'kind': 'inline-event:' + name, 'line': line, 'code': value})
                      if name == 'href' and value and value.lower().startswith('javascript:'):
                          units.append({'path': self.path, 'kind': 'javascript-url', 'line': line, 'code': value})
                  if tag == 'script':
                      if values.get('src'):
                          external_scripts.append({'path': self.path, 'line': line, 'src': values['src']})
                      else:
                          self.active = {'path': self.path, 'kind': 'inline-script', 'line': line, 'code': ''}
              def handle_data(self, data):
                  if self.active is not None:
                      self.active['code'] += data
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active is not None:
                      if self.active['code'].strip():
                          units.append(self.active)
                      self.active = None
              def finish(self):
                  self.close()
                  if self.active is not None and self.active['code'].strip():
                      units.append(self.active)
                      self.active = None

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          scanned = []
          for name in sorted(filter(None, tracked)):
              path = Path(name)
              if name == '.github/workflows/audit-discord-link-referrers.yml':
                  continue
              if path.suffix.lower() not in {'.js', '.mjs', '.cjs', '.html', '.htm', '.svg', '.py', '.yml', '.yaml'}:
                  continue
              data = path.read_bytes()
              text = data.decode('utf-8-sig')
              scanned.append({'path': name, 'blob': blob(data), 'bytes': len(data)})
              if path.suffix.lower() in {'.js', '.mjs', '.cjs'}:
                  units.append({'path': name, 'kind': 'standalone-script', 'line': 1, 'code': text})
              elif '<script' in text.lower() or re.search(r'\bon\w+\s*=', text, re.I):
                  parser = Scripts(name)
                  parser.feed(text)
                  parser.finish()

          pattern = re.compile(r'discord|addEventListener|\bonclick\b|\.on\s*\(|preventDefault|stop(?:Immediate)?Propagation|window\s*\.\s*open|\blocation\b|\.href\s*=|setAttribute(?:NS)?\s*\([^)]{0,120}[\x22\x27](?:href|on\w+)[\x22\x27]|\.click\s*\(|createElement\s*\(\s*[\x22\x27]script|\beval\s*\(|\bFunction\s*\(', re.I)
          inventory = []
          findings = []
          for unit in units:
              code = unit['code']
              inventory.append({k: unit[k] for k in ('path', 'kind', 'line')} | {'characters': len(code), 'sha256': hashlib.sha256(code.encode()).hexdigest()})
              ranges = []
              for match in pattern.finditer(code):
                  start, end = max(0, match.start() - 120), min(len(code), match.end() + 180)
                  if ranges and start <= ranges[-1][1]:
                      ranges[-1][1] = max(ranges[-1][1], end)
                  else:
                      ranges.append([start, end])
              if unit['kind'].startswith('inline-event:') or unit['kind'] == 'javascript-url':
                  ranges = [[0, len(code)]]
              for start, end in ranges:
                  findings.append({'path': unit['path'], 'kind': unit['kind'], 'line': unit['line'] + code[:start].count('\n'), 'excerpt': code[start:end]})

          class Invites(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  url = urlsplit(values.get('href', ''))
                  if tag == 'a' and (url.hostname in {'discord.gg', 'www.discord.gg'} or (url.hostname in {'discord.com', 'www.discord.com', 'discordapp.com'} and url.path.startswith('/invite/'))):
                      self.links.append(values)

          before = Invites()
          before.feed(source.decode())
          assert len(before.links) == 4, 'Expected four Discord invite anchors including noscript'
          needle = b'href="https://discord.com/invite/avApuUXfN9"'
          replacement = needle + b' referrerpolicy="no-referrer"'
          assert source.count(needle) == 4
          assert not any('referrerpolicy' in link for link in before.links), 'An invite already has a policy; review before editing'
          result = source.replace(needle, replacement)
          after = Invites()
          after.feed(result.decode())
          assert len(after.links) == 4 and all(link.get('referrerpolicy') == 'no-referrer' for link in after.links)
          assert result.replace(replacement, needle) == source
          assert blob(result) == 'ef066746309e7b1f646ba385dc558e5626e16684', 'Unexpected homepage output'
          report = {'method': 'Repository-wide static candidate scan, not a browser execution test or a proof against obfuscated/dynamically fetched code. Excerpts require review; matches are not automatically defects.', 'scanned_files': scanned, 'script_inventory': inventory, 'external_script_references': external_scripts, 'candidate_excerpts': findings, 'index_before': blob(source), 'index_after': blob(result), 'invite_anchors_updated': 4}
          encoded = base64.b64encode(zlib.compress(json.dumps(report, ensure_ascii=False).encode(), 9)).decode()
          message = 'Add explicit no-referrer policy to Discord invite links\n\nScanned ' + str(len(scanned)) + ' tracked source files and ' + str(len(units)) + ' script/event units. Static candidates are recorded for review; no JavaScript handlers were automatically removed.\n\nDiscord-Audit-Zlib-Base64: ' + encoded + '\n'
          Path('/tmp/hylian-discord-referrer-commit.txt').write_text(message)
          home.write_bytes(result)
          Path('.github/workflows/audit-discord-link-referrers.yml').unlink()
          print(json.dumps({'scanned_source_files': len(scanned), 'script_units': len(units), 'candidate_excerpts': len(findings), 'audit_encoded_characters': len(encoded), 'index_after': blob(result)}))
          PY
      - name: Commit homepage with audit record and remove temporary installer
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/audit-discord-link-referrers.yml
          git commit -F /tmp/hylian-discord-referrer-commit.txt
          git push origin HEAD:main
