name: Activate reviewed Guild Hall Relay homepage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-guild-hall-relay.yml']
permissions:
  contents: write
concurrency:
  group: activate-guild-hall-relay
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact reviewed homepage with source and asset guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, zlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          home = Path('index.html')
          source = home.read_bytes()
          assert blob(source) == 'ceba4987ed9ed048bd975d974b2747b8c413f1f5', 'Homepage changed; refusing to overwrite it'
          assets = {
              'assets/guild-hall-relay/app.js': 'c0c134ae3dd563cc5a306a70372cea21da2eb9fd',
              'assets/guild-hall-relay/widget.js': 'c2a19ae73c996056655744ce3cd638d81d9f1dc0',
              'assets/guild-hall-relay/relay.css': 'd0a8e65ec96e4dd2d64989b259e04c6816c77551',
          }
          for name, expected in assets.items():
              assert blob(Path(name).read_bytes()) == expected, 'Widget asset changed: ' + name
          payload = json.loads(zlib.decompress(base64.b64decode('')))
          text = source.decode('utf-8')
          pattern = r'<section class="hearth" id="discord">.*?</section>'
          assert len(re.findall(pattern, text, re.S)) == 1, 'Expected exactly one static Discord section'
          assert text.count('</head>') == 1, 'Expected exactly one document head'
          updated = re.sub(pattern, lambda _: payload['fragment'], text, count=1, flags=re.S)
          updated = updated.replace('</head>', payload['wiring'] + '</head>', 1).encode('utf-8')
          assert blob(updated) == '5afd549dbc98ed1457cea079a99ad8b54a256c89', 'Result does not match the reviewed homepage'
          home.write_bytes(updated)
          Path('.github/workflows/activate-guild-hall-relay.yml').unlink()
          PY
      - name: Commit homepage and remove this temporary installer
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/activate-guild-hall-relay.yml
          git commit -m 'Activate Guild Hall Relay live Discord widget on homepage'
          git push origin HEAD:main
